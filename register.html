<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quórum - Registro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {font-family: 'Outfit', sans-serif;}
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex items-center justify-center">
    <div class="bg-white/10 backdrop-blur-lg rounded-xl shadow-xl p-8 w-full max-w-md">
        <h1 class="text-4xl font-bold text-center text-white mb-6">Crear cuenta</h1>
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-200" for="name">Nombre</label>
                <input type="text" id="name" name="name" required class="mt-1 block w-full rounded-md border-gray-300 bg-gray-800 text-white focus:ring-2 focus:ring-purple-500" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-200" for="email">Correo</label>
                <input type="email" id="email" name="email" required class="mt-1 block w-full rounded-md border-gray-300 bg-gray-800 text-white focus:ring-2 focus:ring-purple-500" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-200" for="password">Contraseña</label>
                <input type="password" id="password" name="password" required minlength="6" class="mt-1 block w-full rounded-md border-gray-300 bg-gray-800 text-white focus:ring-2 focus:ring-purple-500" />
            </div>
            <button type="submit" class="w-full py-2 bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 text-white font-semibold rounded-md hover:opacity-90 transition">
                Registrarse
            </button>
        </form>
        <p class="mt-4 text-center text-gray-300">¿Ya tienes cuenta? <a href="Index.html" class="text-purple-300 hover:underline">Inicia sesión</a></p>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const original = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Registrando...';
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            try {
                const resp = await fetch('auth/register.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await resp.json();
                if (resp.ok) {
                    alert('Registro exitoso. Ahora puedes iniciar sesión.');
                    window.location.href = 'Index.html';
                } else {
                    throw new Error(result.message || 'Error al registrar');
                }
            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btn.innerHTML = original;
            }
        });
    </script>
</body>
</html>
